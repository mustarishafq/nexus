stages:
  - test
  - build
  - deploy

variables:
  COMPOSER_NO_INTERACTION: "1"

# =========================
# TEST BACKEND
# =========================

test:backend:
  stage: test
  image: php:8.5-cli

  before_script:
    - apt-get update -qq
    - apt-get install -y -qq git unzip libzip-dev libsqlite3-dev
    - docker-php-ext-install pdo_sqlite zip
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer

  script:
    - cd backend
    - cp .env.example .env
    - composer install --prefer-dist --no-progress
    - php artisan key:generate

# =========================
# BUILD FRONTEND
# =========================

build:frontend:
  stage: build
  image: node:20-bookworm

  script:
    - echo "VITE_API_BASE_URL=$PRODUCTION_VITE_API_BASE_URL" > frontend/.env.production
    - cd frontend
    - npm ci
    - npm run build

  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 week

# =========================
# DEPLOY PRODUCTION
# =========================

deploy:production:
  stage: deploy
  image: alpine:3.21

  needs:
    - test:backend
    - build:frontend

  before_script:
    - apk add --no-cache openssh-client rsync
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$PRODUCTION_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_deploy
    - chmod 600 ~/.ssh/id_deploy
    - ssh-add ~/.ssh/id_deploy
    - ssh-keyscan -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts

  script:

    # Deploy Laravel
    - rsync -az --delete
      --exclude='.env'
      --exclude='vendor/'
      --exclude='storage/'
      --exclude='.git/'
      backend/
      "$PRODUCTION_USER@$PRODUCTION_HOST:$PRODUCTION_BACKEND_PATH/"

    # Frontend — do not rsync --delete hashed Vite files.
    # A new build uses new filenames (index-XXXX.js). Installed PWAs still
    # request the previous hash; deleting it makes Apache return HTML and
    # Chrome throws: MIME type "text/html" instead of JavaScript.
    # 1) Publish new /assets/* first (add only, never delete).
    # 2) Then update index.html / sw.js / icons. Protect /assets/ from --delete.
    - rsync -az --delay-updates
      frontend/dist/assets/
      "$PRODUCTION_USER@$PRODUCTION_HOST:$PRODUCTION_FRONTEND_PATH/assets/"
    - rsync -az --delete --delay-updates
      --filter='P /assets/'
      --filter='P /assets/**'
      --exclude='/assets/'
      frontend/dist/
      "$PRODUCTION_USER@$PRODUCTION_HOST:$PRODUCTION_FRONTEND_PATH/"

    # Laravel setup
    - ssh "$PRODUCTION_USER@$PRODUCTION_HOST"
      "cd $PRODUCTION_BACKEND_PATH &&
       composer install --no-dev --optimize-autoloader --no-interaction &&
       php artisan migrate --force &&
       php artisan storage:link &&
       php artisan config:cache"

  rules:
    - if: '$CI_COMMIT_BRANCH == "master"'